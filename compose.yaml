services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bears}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bears}
      POSTGRES_DB: ${POSTGRES_DB:-bears}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3000'
      WIKIPEDIA_BASE_URL: ${WIKIPEDIA_BASE_URL:-https://en.wikipedia.org}
      USER_AGENT: ${USER_AGENT:-BearApp/0.1 (Web Engineering course playground)}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENABLE_DEBUG_ROUTES: 'false'
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:-bears}@db:5432/${POSTGRES_DB:-bears}
      MIGRATE_ON_START: 'true'
      # naive = lost-update demo (Task 5), locked = SELECT … FOR UPDATE
      REPORT_MODE: ${REPORT_MODE:-locked}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/scripts/seed.js']
    environment:
      WIKIPEDIA_BASE_URL: ${WIKIPEDIA_BASE_URL:-https://en.wikipedia.org}
      USER_AGENT: ${USER_AGENT:-BearApp/0.1 (Web Engineering course playground)}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-5000}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:-bears}@db:5432/${POSTGRES_DB:-bears}
    healthcheck:
      disable: true
    restart: 'no'
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
